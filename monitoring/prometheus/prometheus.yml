global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fraudshield_api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "fraudshield-api"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
