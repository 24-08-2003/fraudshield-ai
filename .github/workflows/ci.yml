name: CI — Lint, Test & Validate

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend-lint-test:
    name: Backend — Ruff + Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraudshield
          POSTGRES_PASSWORD: fraudshield
          POSTGRES_DB: fraudshield
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint with Ruff
        run: ruff check backend/app/ tests/backend/

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://fraudshield:fraudshield@localhost:5432/fraudshield
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: pytest tests/backend/ -v --tb=short --cov=backend/app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: backend

  # ── ML Pipeline ───────────────────────────────────────────────────────────
  ml-lint-test:
    name: ML — Ruff + Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Lint ML code
        run: ruff check ml/src/ tests/ml/

      - name: Run ML tests
        run: pytest tests/ml/ -v --tb=short

      - name: Validate Great Expectations suite
        run: |
          cd ml
          python -c "import json; suite=json.load(open('great_expectations/expectations/fraud_data_suite.json')); print(f'✅ GE suite has {len(suite[\"expectations\"])} expectations')"

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend-lint-build:
    name: Frontend — ESLint + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000

  # ── Docker Build Check ────────────────────────────────────────────────────
  docker-build-check:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend-lint-test, ml-lint-test, frontend-lint-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
