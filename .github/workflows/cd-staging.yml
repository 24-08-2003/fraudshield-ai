name: CD Staging

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fraudshield-ai

jobs:
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=sha,prefix=staging-

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta.outputs.version }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta.outputs.version }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-staging.fraudshield.ai
            NEXT_PUBLIC_WS_URL=wss://api-staging.fraudshield.ai

  deploy-staging:
    name: Deploy to Staging
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          IMAGE_TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          ssh -o StrictHostKeyChecking=no deploy@$STAGING_HOST << EOF
            cd /opt/fraudshield-staging
            echo "IMAGE_TAG=$IMAGE_TAG" > .env.deploy
            docker compose -f infrastructure/docker-compose.yml pull backend frontend
            docker compose -f infrastructure/docker-compose.yml up -d backend frontend
            docker image prune -f
          EOF

      - name: Smoke test staging
        run: |
          sleep 30
          curl -f https://api-staging.fraudshield.ai/api/v1/health || exit 1

      - name: Notify deployment
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚀 FraudShield AI staging deployment ${{ job.status }} — tag: ${{ needs.build-push.outputs.tag }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
